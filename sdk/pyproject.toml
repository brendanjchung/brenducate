[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brenducate-sdk"
version = "0.2.0"
description = "Per-tenant margin guardrails, same-family Smart Degradation, and sub-millisecond loop interception for OpenAI and Anthropic agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.brenducate.com"
Source = "https://github.com/brendanjchung/agentpulse"

[tool.setuptools.packages.find]
where = ["."]
include = ["brenducate*"]
