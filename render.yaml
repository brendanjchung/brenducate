# ==============================================================================
# AgentPulse Ops — Render 1-Click Cloud Deployment Blueprint
# ==============================================================================
# Deploy: Connect your GitHub repository to Render.com -> Blueprints -> New Blueprint Instance

services:
  # 1. FastAPI Edge Ingestion API
  - type: web
    name: agentpulse-api
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: agentpulse-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  # 2. Managed PostgreSQL Database (Free Tier)
  - name: agentpulse-db
    region: oregon
    plan: free
    databaseName: agentpulse
    user: agentpulse_admin

